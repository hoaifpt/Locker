$kind: http-request
url: "{{base_url}}/api/orders/reserve"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "lockerId": 1,
      "slotIndex": 0,
      "packageId": 1,
      "startTime": "2025-01-01T10:00:00Z",
      "endTime": "2025-01-01T12:00:00Z"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 3000
