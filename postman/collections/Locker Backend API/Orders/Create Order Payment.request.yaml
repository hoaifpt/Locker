$kind: http-request
url: "{{base_url}}/api/orders/:id/payment"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
pathVariables:
  id: "1"
body:
  type: json
  content: |-
    {
      "amount": 10000,
      "paymentMethod": "wallet"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 11000
