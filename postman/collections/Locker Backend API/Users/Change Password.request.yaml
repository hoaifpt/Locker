$kind: http-request
url: "{{base_url}}/api/users/me/change-password"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "oldPassword123",
      "newPassword": "newPassword123"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 3000
