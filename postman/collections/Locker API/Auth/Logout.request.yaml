$kind: http-request
name: Logout
method: POST
url: '{{baseUrl}}/api/auth/logout'
order: 6000
headers:
  - key: Content-Type
    value: application/json
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
body:
  type: json
  content: |-
    {
      "refreshToken": "{{refreshToken}}"
    }
