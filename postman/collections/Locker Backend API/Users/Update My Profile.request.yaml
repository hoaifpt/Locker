$kind: http-request
url: "{{base_url}}/api/users/me"
method: PUT
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Updated User",
      "phoneNumber": "0123456789"
    }
auth:
  type: bearer
  credentials:
    token: "{{token}}"
order: 2000
