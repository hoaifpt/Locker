$kind: http-request
name: Payment Webhook
method: POST
url: '{{baseUrl}}/api/payments/webhook'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "paymentId": "{{paymentId}}",
      "transactionId": "TXN123456",
      "isSuccess": true
    }
