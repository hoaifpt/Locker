name: locker_mobile
description: "A mobile application for the Locker project, featuring food ordering and maps."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.5.4
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  mobile_scanner: ^6.0.0
  get_it: ^9.2.1
  mapbox_maps_flutter: ^2.25.0
  geolocator: ^11.0.0
  url_launcher: ^6.2.5


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
