<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#FF6B35"/>
  
  <!-- E letter stylized as locker door -->
  <rect x="55" y="50" width="90" height="100" rx="8" fill="white"/>
  
  <!-- E horizontal lines -->
  <rect x="65" y="60" width="70" height="8" fill="#FF6B35"/>
  <rect x="65" y="96" width="70" height="8" fill="#FF6B35"/>
  <rect x="65" y="132" width="70" height="8" fill="#FF6B35"/>
  
  <!-- E vertical line -->
  <rect x="55" y="50" width="12" height="100" fill="#FF6B35"/>
  
  <!-- Locker handle -->
  <rect x="120" y="90" width="8" height="20" rx="2" fill="#FF6B35"/>
  
  <!-- Box effect lines -->
  <rect x="55" y="50" width="90" height="8" fill="#E55A2B"/>
  <rect x="55" y="142" width="90" height="8" fill="#E55A2B"/>
</svg>
